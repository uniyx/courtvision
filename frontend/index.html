<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Courtvision</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              ink: "#111827",
              line: "#d6d9df",
              court: "#b45309",
              mint: "#0f766e"
            }
          }
        }
      };
    </script>
  </head>
  <body class="min-h-screen bg-zinc-50 text-ink">
    <main class="mx-auto flex min-h-screen w-full max-w-6xl flex-col px-4 py-6 sm:px-6 lg:px-8">
      <header class="flex flex-col gap-4 border-b border-line pb-5 sm:flex-row sm:items-end sm:justify-between">
        <div>
          <h1 class="text-2xl font-semibold tracking-normal">Courtvision</h1>
          <p class="mt-1 text-sm text-zinc-600">Natural language NBA play search engine</p>
        </div>
        <div class="flex items-center gap-2 text-xs text-zinc-500">
          <span id="apiStatusDot" class="h-2.5 w-2.5 rounded-full bg-zinc-300"></span>
          <span id="apiStatus">API not checked</span>
        </div>
      </header>

      <section class="py-5">
        <form id="searchForm" class="grid gap-3 md:grid-cols-[1fr_150px_auto]">
          <label class="block">
            <span class="sr-only">Search query</span>
            <input
              id="queryInput"
              class="h-12 w-full border border-line bg-white px-4 text-base outline-none transition focus:border-ink focus:ring-2 focus:ring-ink/10"
              value="victor wembanyama dunk playoffs against thunder"
              placeholder="Try: victor wembanyama dunk playoffs against thunder"
              autocomplete="off"
            />
          </label>
          <label class="block">
            <span class="sr-only">Season</span>
            <select
              id="seasonSelect"
              class="h-12 w-full border border-line bg-white px-3 text-sm outline-none transition focus:border-ink focus:ring-2 focus:ring-ink/10"
            >
              <option value="2025-26" selected>2025-26</option>
              <option value="2024-25">2024-25</option>
              <option value="2023-24">2023-24</option>
              <option value="2022-23">2022-23</option>
              <option value="2021-22">2021-22</option>
              <option value="2020-21">2020-21</option>
              <option value="2019-20">2019-20</option>
              <option value="2018-19">2018-19</option>
            </select>
          </label>
          <button
            id="searchButton"
            class="h-12 border border-ink bg-ink px-5 text-sm font-medium text-white transition hover:bg-zinc-700 disabled:cursor-not-allowed disabled:border-zinc-300 disabled:bg-zinc-300"
            type="submit"
          >
            Search
          </button>
        </form>

        <div class="mt-3 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
          <div class="flex flex-wrap gap-2" aria-label="Example searches">
            <button class="example rounded border border-line bg-white px-3 py-1.5 text-sm hover:border-ink" type="button">victor wembanyama dunk playoffs against thunder</button>
            <button class="example rounded border border-line bg-white px-3 py-1.5 text-sm hover:border-ink" type="button">james harden clutch misses</button>
            <button class="example rounded border border-line bg-white px-3 py-1.5 text-sm hover:border-ink" type="button">cade fadeaways</button>
          </div>
          <label class="flex items-center gap-2 text-sm text-zinc-600">
            <span>API</span>
            <input id="apiBaseInput" class="h-9 w-56 border border-line bg-white px-3 text-sm outline-none focus:border-ink" value="http://127.0.0.1:8000" />
          </label>
        </div>
        <p id="interpretationText" class="mt-3 hidden border-l-2 border-mint bg-white px-3 py-2 text-sm text-zinc-700"></p>
        <div id="warningBox" class="mt-3 hidden border-l-2 border-amber-500 bg-white px-3 py-2 text-sm text-amber-800"></div>
      </section>

      <section class="grid flex-1 gap-4 lg:grid-cols-[minmax(0,1fr)_360px]">
        <div class="min-h-[420px] border border-line bg-white">
          <div class="flex items-center justify-between border-b border-line px-4 py-3">
            <div>
              <h2 class="text-sm font-semibold">Results</h2>
              <p id="resultMeta" class="mt-0.5 text-xs text-zinc-500">Run a search to load plays.</p>
            </div>
            <button id="clearButton" class="hidden rounded border border-line px-3 py-1.5 text-sm hover:border-ink" type="button">Clear</button>
          </div>

          <div id="emptyState" class="flex h-80 items-center justify-center px-6 text-center text-sm text-zinc-500">
            Search results will appear here.
          </div>

          <div id="resultsList" class="hidden divide-y divide-line"></div>
        </div>

        <aside class="border border-line bg-white lg:sticky lg:top-4 lg:max-h-[calc(100vh-2rem)] lg:overflow-auto lg:self-start">
          <div class="border-b border-line px-4 py-3">
            <h2 class="text-sm font-semibold">Selected Play</h2>
            <p class="mt-0.5 text-xs text-zinc-500">Use the NBA event page when direct MP4 playback fails.</p>
          </div>
          <div id="detailPane" class="p-4 text-sm text-zinc-500">
            Select a result to inspect links.
          </div>
        </aside>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
